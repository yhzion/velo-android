name: Pull request check (Android)

# The Android unit tests of release.yml, on the pull request instead of after the tag (#379).
# Only when app/ or the Gradle build files change; pr-check-native.yml covers native/. The
# repository is on GitHub Free, so draft pull requests and other paths start no job: the release
# workflow runs the same tests on the tag. No secrets, no signing, no artifacts.
#
# A push to main runs the same tests to fill the dependency cache that pull requests start from
# (#257). GitHub lets a pull request read the caches of its base branch, and main never reads a
# pull request's caches.
on:
  push:
    branches: [main]
    paths: &paths
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      # ChangeNotesTest compares its max_item_length with MAX_CHANGE_LENGTH.
      - '.github/scripts/changelog.sh'
      - '.github/scripts/gradle-retry.sh'
      - '.github/workflows/pr-check-android.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  contents: read
# The draft state is part of the group: a late draft run (its job skipped) must not cancel the
# run of the pull request that is ready. A push to main has no pull request and groups by its ref.
concurrency:
  group: pr-check-android-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  unit-test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # A run takes 3 to 4 minutes. gradle-retry.sh may run the tests five times and wait 12
    # minutes between them, up to 15 when a server asks for longer with Retry-After (#221).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle, the Android platform and JDK 25 as release.yml pins them; keep the two in step.
      # No zig, Go or NDK: see the test step.
      - name: Install Gradle and the Android platform
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          curl -fsSLo gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          echo 'bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01  gradle.zip' | sha256sum -c -
          unzip -q gradle.zip
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.1' 'build-tools;36.0.0'
          echo "JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
          printf '%s\n' "$PWD/gradle-9.6.0/bin" "$JAVA_HOME_25_X64/bin" >> "$GITHUB_PATH"

      # Gradle's downloaded plugins and libraries (#257), Robolectric's android-all jar among them:
      # app/build.gradle.kts resolves it as the robolectricSdk configuration since #214, so it is
      # no longer fetched into ~/.m2. release.yml keeps no cache on purpose: what ships is built
      # from downloads checked at that moment. The Gradle distribution is not cached:
      # services.gradle.org has not failed a run, and the step above checks its hash. The key
      # names the Gradle version above, which no hashed file holds; change it here with that step.
      # A new key starts from the newest older cache and saves the result under itself.
      - name: Restore the dependency cache
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-deps-${{ runner.os }}-gradle-9.6.0-${{ hashFiles('*.gradle.kts', 'app/*.gradle.kts', 'gradle.properties', 'gradle/**') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      # The JVM unit tests do not load the native libraries. zigCore and tailscale cross-compile
      # libvelocore.so and libtailscale.so for the APK (with zig, Go and the NDK), which is most of
      # the build time; the release workflow still builds both. gradle-retry.sh runs the tests
      # again only when a repository could not be reached (a plugin that did not resolve, HTTP
      # 429, a timeout), never after a compile error or a failing test (#212).
      - name: Run Android unit tests
        run: >-
          bash .github/scripts/gradle-retry.sh
          gradle --no-daemon --no-scan :app:testDebugUnitTest -x zigCore -x tailscale

      - name: Show the size of the dependency cache
        if: steps.restore.outputs.cache-hit != 'true'
        run: du -sh ~/.gradle/caches/modules-2 || true

      # Saved only after the tests pass, so a run cut short by a 429 leaves no half-filled cache
      # under the key. A pull request from a fork saves nothing; GitHub would keep its cache to
      # that pull request anyway. A cache is written once per key: an exact hit skips the save.
      - name: Save the dependency cache
        if: >-
          steps.restore.outputs.cache-hit != 'true' && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ steps.restore.outputs.cache-primary-key }}
