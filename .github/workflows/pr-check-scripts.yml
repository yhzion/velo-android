name: Pull request check (scripts)

# Self-tests for the release and pull-request scripts under .github/scripts/.
# Only when .github/scripts/, CHANGELOG.md or this workflow changes; no Android tools, zig, Go or secrets.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/pr-check-scripts.yml'
      - 'CHANGELOG.md'

permissions:
  contents: read
concurrency:
  group: pr-check-scripts-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test changelog.sh
        run: bash .github/scripts/test-changelog.sh

      - name: Test release-version.sh
        run: bash .github/scripts/test-release-version.sh

      - name: Test verify-apk-notices.py
        run: python3 .github/scripts/test-verify-apk-notices.py
